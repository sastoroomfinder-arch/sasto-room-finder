<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SastoRoomFinder - Admin Login</title>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f7fb;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-card {
      width: 100%;
      max-width: 420px;
      background: white;
      padding: 32px;
      border-radius: 18px;
      box-shadow: 0 12px 40px rgba(0,0,0,0.12);
    }

    .logo {
      text-align: center;
      font-size: 28px;
      font-weight: 800;
      color: #1769e0;
      margin-bottom: 6px;
    }

    .subtitle {
      text-align: center;
      color: #667085;
      margin-bottom: 25px;
    }

    .tabs {
      display: flex;
      border-bottom: 1px solid #ddd;
      margin-bottom: 22px;
    }

    .tab {
      flex: 1;
      padding: 12px;
      border: none;
      background: transparent;
      cursor: pointer;
      font-size: 14px;
      font-weight: 700;
      color: #777;
    }

    .tab.active {
      color: #1769e0;
      border-bottom: 3px solid #1769e0;
    }

    label {
      display: block;
      font-weight: 700;
      margin: 15px 0 7px;
      color: #222;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #ccd3df;
      border-radius: 9px;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #1769e0;
      box-shadow: 0 0 0 3px rgba(23,105,224,0.1);
    }

    .login-button {
      width: 100%;
      margin-top: 22px;
      padding: 14px;
      border: none;
      border-radius: 9px;
      background: #1769e0;
      color: white;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    .login-button:hover {
      background: #1258bd;
    }

    .login-button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #message {
      display: none;
      margin-top: 16px;
      padding: 12px;
      border-radius: 8px;
      font-size: 14px;
      line-height: 1.5;
    }

    .error {
      display: block !important;
      background: #fff0f0;
      color: #b42318;
    }

    .success {
      display: block !important;
      background: #eaf8ef;
      color: #137333;
    }

    .info {
      display: block !important;
      background: #eef5ff;
      color: #175cd3;
    }

    .signup-form {
      display: none;
    }

    .dashboard {
      display: none;
      width: 100%;
      max-width: 900px;
    }

    .dashboard-card {
      background: white;
      border-radius: 18px;
      padding: 30px;
      box-shadow: 0 12px 40px rgba(0,0,0,0.12);
    }

    .dashboard-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
    }

    .dashboard-title {
      font-size: 26px;
      font-weight: 800;
      color: #1769e0;
    }

    .logout {
      border: none;
      background: #222;
      color: white;
      padding: 10px 17px;
      border-radius: 8px;
      cursor: pointer;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      margin-top: 25px;
    }

    .stat {
      background: #f7f9fc;
      border: 1px solid #e2e7ef;
      padding: 22px;
      border-radius: 12px;
    }

    .stat-title {
      color: #667085;
    }

    .stat-number {
      font-size: 30px;
      font-weight: 800;
      margin-top: 8px;
    }

    .success-box {
      margin-top: 22px;
      padding: 18px;
      background: #eaf8ef;
      border: 1px solid #b7e4c7;
      border-radius: 12px;
      color: #137333;
    }

    @media (max-width: 600px) {
      .login-card {
        padding: 22px;
      }

      .stats {
        grid-template-columns: 1fr;
      }

      .dashboard-header {
        align-items: flex-start;
      }
    }
  </style>
</head>

<body>

  <!-- =========================
       LOGIN PANEL
  ========================== -->

  <div class="login-card" id="loginPanel">

    <div class="logo">
      🏠 SastoRoomFinder
    </div>

    <div class="subtitle">
      Admin & House Owner Portal
    </div>

    <!-- Tabs -->
    <div class="tabs">

      <button
        type="button"
        class="tab active"
        id="loginTab"
        onclick="showLogin()">
        LOGIN
      </button>

      <button
        type="button"
        class="tab"
        id="signupTab"
        onclick="showSignup()">
        OWNER SIGN UP
      </button>

    </div>


    <!-- =========================
         LOGIN FORM
    ========================== -->

    <div id="loginForm">

      <label for="email">
        Email
      </label>

      <input
        id="email"
        type="email"
        value="admin.sastoroomfinder@gmail.com"
        placeholder="Enter email"
        autocomplete="username"
      >


      <label for="password">
        Password
      </label>

      <input
        id="password"
        type="password"
        placeholder="Enter password"
        autocomplete="current-password"
      >


      <button
        type="button"
        class="login-button"
        id="loginButton"
        onclick="doLogin()">

        LOGIN

      </button>

    </div>


    <!-- =========================
         OWNER SIGN UP
    ========================== -->

    <div
      class="signup-form"
      id="signupForm">

      <label for="ownerName">
        Full Name
      </label>

      <input
        id="ownerName"
        type="text"
        placeholder="Your full name"
      >


      <label for="ownerEmail">
        Email
      </label>

      <input
        id="ownerEmail"
        type="email"
        placeholder="Email address"
      >


      <label for="ownerPassword">
        Password
      </label>

      <input
        id="ownerPassword"
        type="password"
        placeholder="Create password"
      >


      <label for="ownerPhone">
        Phone
      </label>

      <input
        id="ownerPhone"
        type="tel"
        placeholder="Phone number"
      >


      <button
        type="button"
        class="login-button"
        onclick="doSignup()">

        CREATE OWNER ACCOUNT

      </button>

    </div>


    <!-- MESSAGE -->
    <div id="message"></div>

  </div>


  <!-- =========================
       DASHBOARD
  ========================== -->

  <div
    class="dashboard"
    id="dashboard">

    <div class="dashboard-card">

      <div class="dashboard-header">

        <div>

          <div class="dashboard-title">
            🏠 SastoRoomFinder
          </div>

          <div>
            Admin Dashboard
          </div>

        </div>

        <button
          type="button"
          class="logout"
          onclick="doLogout()">

          Logout

        </button>

      </div>


      <!-- STATS -->

      <div class="stats">

        <div class="stat">

          <div class="stat-title">
            Total Properties
          </div>

          <div
            class="stat-number"
            id="totalProperties">

            0

          </div>

        </div>


        <div class="stat">

          <div class="stat-title">
            Available
          </div>

          <div
            class="stat-number"
            id="availableProperties">

            0

          </div>

        </div>


        <div class="stat">

          <div class="stat-title">
            Pending
          </div>

          <div
            class="stat-number"
            id="pendingProperties">

            0

          </div>

        </div>

      </div>


      <div class="success-box">

        <strong>
          ✅ Login successful
        </strong>

        <p id="userInfo">
          You are authenticated.
        </p>

      </div>

    </div>

  </div>


  <!-- =========================
       JAVASCRIPT
  ========================== -->

  <script>

    /*
      YOUR SUPABASE CONNECTION
    */

    const SUPABASE_URL =
      "https://amhrnahjshsgelacqzyl.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_f2morNcNVHaA4MhsellIRA_Mbgv0yFj";


    /*
      CREATE SUPABASE CLIENT
    */

    const db =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    /*
      SHOW MESSAGE
    */

    function showMessage(text, type) {

      const box =
        document.getElementById("message");

      box.textContent = text;

      box.className = type;

    }


    /*
      LOGIN TAB
    */

    function showLogin() {

      document.getElementById("loginForm")
        .style.display = "block";

      document.getElementById("signupForm")
        .style.display = "none";

      document.getElementById("loginTab")
        .classList.add("active");

      document.getElementById("signupTab")
        .classList.remove("active");

      document.getElementById("message")
        .className = "";

    }


    /*
      SIGNUP TAB
    */

    function showSignup() {

      document.getElementById("loginForm")
        .style.display = "none";

      document.getElementById("signupForm")
        .style.display = "block";

      document.getElementById("loginTab")
        .classList.remove("active");

      document.getElementById("signupTab")
        .classList.add("active");

      document.getElementById("message")
        .className = "";

    }


    /*
      LOGIN
    */

    async function doLogin() {

      const email =
        document.getElementById("email")
          .value
          .trim();

      const password =
        document.getElementById("password")
          .value;

      const button =
        document.getElementById("loginButton");


      /*
        CHECK INPUT
      */

      if (!email) {

        showMessage(
          "Please enter your email.",
          "error"
        );

        return;

      }


      if (!password) {

        showMessage(
          "Please enter your password.",
          "error"
        );

        return;

      }


      /*
        CHANGE BUTTON
      */

      button.disabled = true;

      button.textContent =
        "LOGGING IN...";


      showMessage(
        "Connecting to Supabase...",
        "info"
      );


      try {

        /*
          SUPABASE LOGIN
        */

        const result =
          await db.auth.signInWithPassword({

            email: email,

            password: password

          });


        const data =
          result.data;

        const error =
          result.error;


        /*
          LOGIN ERROR
        */

        if (error) {

          showMessage(
            "Login failed: " +
            error.message,
            "error"
          );

          button.disabled = false;

          button.textContent =
            "LOGIN";

          return;

        }


        /*
          LOGIN SUCCESS
        */

        document.getElementById("loginPanel")
          .style.display = "none";

        document.getElementById("dashboard")
          .style.display = "block";


        const user =
          data.user;


        document.getElementById("userInfo")
          .innerHTML =
          "<strong>Email:</strong> " +
          escapeHTML(user.email || "") +
          "<br><br>" +
          "<strong>User ID:</strong> " +
          escapeHTML(user.id || "");


        /*
          LOAD PROPERTY COUNTS
        */

        loadPropertyCounts();

      }

      catch (error) {

        showMessage(
          "Connection error: " +
          error.message,
          "error"
        );

        button.disabled = false;

        button.textContent =
          "LOGIN";

      }

    }


    /*
      LOAD PROPERTY COUNTS
    */

    async function loadPropertyCounts() {

      try {

        const total =
          await db
            .from("room")
            .select("*", {
              count: "exact",
              head: true
            });


        const available =
          await db
            .from("room")
            .select("*", {
              count: "exact",
              head: true
            })
            .eq("status", "available");


        const pending =
          await db
            .from("room")
            .select("*", {
              count: "exact",
              head: true
            })
            .eq("approval_status", "pending");


        document.getElementById(
          "totalProperties"
        ).textContent =
          total.count ?? 0;


        document.getElementById(
          "availableProperties"
        ).textContent =
          available.count ?? 0;


        document.getElementById(
          "pendingProperties"
        ).textContent =
          pending.count ?? 0;

      }

      catch (error) {

        console.log(
          "Property count error:",
          error.message
        );

      }

    }


    /*
      OWNER SIGNUP
    */

    async function doSignup() {

      const name =
        document.getElementById("ownerName")
          .value
          .trim();

      const email =
        document.getElementById("ownerEmail")
          .value
          .trim();

      const password =
        document.getElementById("ownerPassword")
          .value;

      const phone =
        document.getElementById("ownerPhone")
          .value
          .trim();


      if (!name || !email || !password) {

        showMessage(
          "Please enter name, email and password.",
          "error"
        );

        return;

      }


      showMessage(
        "Creating owner account...",
        "info"
      );


      try {

        const result =
          await db.auth.signUp({

            email: email,

            password: password,

            options: {

              data: {

                full_name: name,

                phone: phone,

                role: "owner"

              }

            }

          });


        if (result.error) {

          showMessage(
            "Sign up failed: " +
            result.error.message,
            "error"
          );

          return;

        }


        showMessage(
          "Owner account created. Check email confirmation if required.",
          "success"
        );

      }

      catch (error) {

        showMessage(
          "Connection error: " +
          error.message,
          "error"
        );

      }

    }


    /*
      LOGOUT
    */

    async function doLogout() {

      await db.auth.signOut();


      document.getElementById("dashboard")
        .style.display = "none";


      document.getElementById("loginPanel")
        .style.display = "block";


      document.getElementById("password")
        .value = "";


      document.getElementById("loginButton")
        .disabled = false;


      document.getElementById("loginButton")
        .textContent = "LOGIN";


      showMessage(
        "You have been logged out.",
        "info"
      );

    }


    /*
      SAFE HTML
    */

    function escapeHTML(value) {

      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }


    /*
      CATCH JAVASCRIPT ERRORS
    */

    window.addEventListener(
      "error",
      function(event) {

        showMessage(
          "Page error: " +
          event.message,
          "error"
        );

      }
    );

  </script>

</body>
</html>
